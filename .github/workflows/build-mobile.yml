name: Build Mobile Apps (Android & iOS with Shorebird)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Shorebird Action (release = create new Base IPA/APK, patch = OTA CodePush without reinstalling)'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'patch'
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'
    branches:
      - main

jobs:
  build-android:
    name: Android with Shorebird (${{ inputs.action || 'release' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          shorebird flutter pub get

      - name: Run Shorebird Action (Android)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          cd mobile
          ACTION="${{ inputs.action || 'release' }}"
          if [ "$ACTION" = "patch" ]; then
            echo "🚀 Publishing Shorebird OTA Patch for Android..."
            shorebird patch android --allow-native-diffs
          else
            echo "📦 Creating Shorebird Base Release for Android..."
            shorebird release android
          fi

      - name: Upload Android APK Artifact
        if: ${{ inputs.action != 'patch' }}
        uses: actions/upload-artifact@v4
        with:
          name: project-edu-android-apk
          path: mobile/build/app/outputs/apk/release/app-release.apk
          retention-days: 14

  build-ios:
    name: iOS with Shorebird (${{ inputs.action || 'release' }})
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          shorebird flutter pub get

      - name: Run Shorebird Action (iOS)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          cd mobile
          ACTION="${{ inputs.action || 'release' }}"
          if [ "$ACTION" = "patch" ]; then
            echo "🚀 Publishing Shorebird OTA Patch for iOS..."
            shorebird patch ios --no-codesign --allow-native-diffs
          else
            echo "📦 Creating Shorebird Base Release for iOS..."
            shorebird release ios --no-codesign
            mkdir -p build/ios/ipa/Payload
            cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r -q project-edu-mobile.ipa Payload
            ls -lh project-edu-mobile.ipa
          fi

      - name: Upload iOS IPA Artifact
        if: ${{ inputs.action != 'patch' }}
        uses: actions/upload-artifact@v4
        with:
          name: project-edu-ios-ipa
          path: mobile/build/ios/ipa/project-edu-mobile.ipa
          retention-days: 14
