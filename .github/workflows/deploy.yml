name: Deploy (Vercel & Supabase)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Quality Gate (Lint, Types, Tests, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build Next.js
        run: npm run build

  deploy-supabase:
    name: Deploy Supabase Migrations
    needs: [verify]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'ppctndzkerwiokjfaklw' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN secret. Please set it in GitHub repository secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing SUPABASE_DB_PASSWORD secret. Please set it in GitHub repository secrets."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize Supabase config if needed
        run: test -f supabase/config.toml || supabase init

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --include-all --yes

  deploy-vercel:
    name: Deploy to Vercel (Production)
    needs: [verify, deploy-supabase]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_glmawLQlxzaWRFiNoQ16yY9G' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_a4MuPE3N1J68C3eoQOtBssOkxkFd' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets present
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN secret. Please set it in GitHub repository secrets."
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build production artifacts
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-preview:
    name: Deploy to Vercel (Preview)
    needs: [verify]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_glmawLQlxzaWRFiNoQ16yY9G' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_a4MuPE3N1J68C3eoQOtBssOkxkFd' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets present
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Missing VERCEL_TOKEN secret. Skipping preview deployment."
            exit 0
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview info
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build preview artifacts
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy to Vercel preview
        run: vercel deploy --prebuilt --token=$VERCEL_TOKEN
